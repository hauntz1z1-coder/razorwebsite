<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Patrocinadores | RAZOR</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primary: #00ff88;
            --color-bg: #0a0a0a;
            --color-card: #111111;
            --color-border: #1a1a1a;
            --color-text: #ffffff;
            --color-text-muted: #888888;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Inter', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-family: var(--font-display);
            font-size: 28px;
            margin-bottom: 10px;
            color: var(--color-primary);
        }

        .subtitle {
            color: var(--color-text-muted);
            margin-bottom: 30px;
        }

        .login-section {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .login-section.hidden {
            display: none;
        }

        .admin-section {
            display: none;
        }

        .admin-section.visible {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--color-text-muted);
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: var(--color-bg);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text);
            font-size: 16px;
            font-family: var(--font-body);
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--color-primary);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--color-primary);
            color: #000;
        }

        .btn-primary:hover {
            background: #00cc6a;
        }

        .btn-danger {
            background: #ff4444;
            color: #fff;
        }

        .btn-danger:hover {
            background: #cc3333;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 14px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            display: block;
            background: rgba(0, 255, 136, 0.1);
            border: 1px solid var(--color-primary);
            color: var(--color-primary);
        }

        .message.error {
            display: block;
            background: rgba(255, 68, 68, 0.1);
            border: 1px solid #ff4444;
            color: #ff4444;
        }

        .card {
            background: var(--color-card);
            border: 1px solid var(--color-border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 30px;
        }

        .card h2 {
            font-family: var(--font-display);
            font-size: 20px;
            margin-bottom: 20px;
            color: var(--color-text);
        }

        .tier-info {
            background: var(--color-bg);
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .tier-info h3 {
            font-size: 14px;
            color: var(--color-primary);
            margin-bottom: 10px;
        }

        .tier-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
        }

        .tier-item {
            text-align: center;
            padding: 10px;
            background: var(--color-card);
            border-radius: 6px;
        }

        .tier-item .name {
            font-weight: 600;
            font-size: 12px;
        }

        .tier-item .range {
            font-size: 11px;
            color: var(--color-text-muted);
        }

        .donors-list {
            margin-top: 20px;
        }

        .donor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--color-bg);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .donor-item .info {
            flex: 1;
        }

        .donor-item .name {
            font-weight: 600;
        }

        .donor-item .details {
            font-size: 14px;
            color: var(--color-text-muted);
        }

        .donor-item .tier-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            margin-right: 10px;
        }

        .tier-SURREAL { background: linear-gradient(135deg, #a855f7 0%, #6366f1 100%); color: #fff; }
        .tier-LENDA { background: linear-gradient(135deg, #f97316 0%, #ea580c 100%); color: #fff; }
        .tier-ELITE { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); color: #fff; }
        .tier-DIAMANTE { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); color: #fff; }
        .tier-PLATINA { background: linear-gradient(135deg, #06b6d4 0%, #0891b2 100%); color: #fff; }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--color-text-muted);
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--color-primary);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 600px) {
            .row {
                grid-template-columns: 1fr;
            }
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--color-text-muted);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="patrocinadores.html" class="back-link">← Voltar para Patrocinadores</a>
        
        <h1>Admin - Patrocinadores</h1>
        <p class="subtitle">Gerencie os doadores da Razor Team</p>

        <!-- Login Section -->
        <div class="login-section" id="loginSection">
            <h2 style="font-family: var(--font-display); margin-bottom: 20px;">Acesso Restrito</h2>
            <div id="loginMessage" class="message"></div>
            <div class="form-group">
                <label>Senha de Admin</label>
                <input type="password" id="adminPassword" placeholder="Digite a senha">
            </div>
            <button class="btn btn-primary" onclick="login()">Entrar</button>
        </div>

        <!-- Admin Section -->
        <div class="admin-section" id="adminSection">
            
            <!-- Add Donor Card -->
            <div class="card">
                <h2>Adicionar Doador</h2>
                
                <div class="tier-info">
                    <h3>Tiers por Valor</h3>
                    <div class="tier-list">
                        <div class="tier-item">
                            <div class="name" style="color: #a855f7;">SURREAL</div>
                            <div class="range">R$ 100+</div>
                        </div>
                        <div class="tier-item">
                            <div class="name" style="color: #f97316;">LENDA</div>
                            <div class="range">R$ 50-99</div>
                        </div>
                        <div class="tier-item">
                            <div class="name" style="color: #22c55e;">ELITE</div>
                            <div class="range">R$ 20-49</div>
                        </div>
                        <div class="tier-item">
                            <div class="name" style="color: #3b82f6;">DIAMANTE</div>
                            <div class="range">R$ 10-19</div>
                        </div>
                        <div class="tier-item">
                            <div class="name" style="color: #06b6d4;">PLATINA</div>
                            <div class="range">R$ 0-9</div>
                        </div>
                    </div>
                </div>

                <div id="addMessage" class="message"></div>

                <div class="row">
                    <div class="form-group">
                        <label>Nome do Doador *</label>
                        <input type="text" id="donorName" placeholder="Ex: PlayerOne">
                    </div>
                    <div class="form-group">
                        <label>Valor (R$) *</label>
                        <input type="number" id="donorAmount" placeholder="Ex: 50.00" step="0.01" min="0">
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Email (opcional)</label>
                        <input type="email" id="donorEmail" placeholder="email@exemplo.com">
                    </div>
                    <div class="form-group">
                        <label>Tier (automatico pelo valor)</label>
                        <input type="text" id="donorTier" readonly placeholder="Sera calculado automaticamente">
                    </div>
                </div>

                <div class="form-group">
                    <label>Mensagem (opcional)</label>
                    <textarea id="donorMessage" rows="2" placeholder="Mensagem do doador"></textarea>
                </div>

                <button class="btn btn-primary" onclick="addDonor()">Adicionar Doador</button>
            </div>

            <!-- Donors List Card -->
            <div class="card">
                <h2>Doadores Cadastrados</h2>
                <div id="donorsList" class="donors-list">
                    <div class="loading">Carregando doadores...</div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = 'razor2024'; // Mude esta senha!
        let isLoggedIn = false;

        // Calculate tier based on amount
        function getTier(amount) {
            if (amount >= 100) return 'SURREAL';
            if (amount >= 50) return 'LENDA';
            if (amount >= 20) return 'ELITE';
            if (amount >= 10) return 'DIAMANTE';
            return 'PLATINA';
        }

        // Update tier preview when amount changes
        document.getElementById('donorAmount').addEventListener('input', function() {
            const amount = parseFloat(this.value) || 0;
            document.getElementById('donorTier').value = getTier(amount);
        });

        // Login function
        function login() {
            const password = document.getElementById('adminPassword').value;
            const messageEl = document.getElementById('loginMessage');

            if (password === ADMIN_PASSWORD) {
                isLoggedIn = true;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('adminSection').classList.add('visible');
                loadDonors();
            } else {
                messageEl.textContent = 'Senha incorreta!';
                messageEl.className = 'message error';
            }
        }

        // Enter key to login
        document.getElementById('adminPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });

        // Add donor
        async function addDonor() {
            const name = document.getElementById('donorName').value.trim();
            const amount = parseFloat(document.getElementById('donorAmount').value);
            const email = document.getElementById('donorEmail').value.trim();
            const message = document.getElementById('donorMessage').value.trim();
            const messageEl = document.getElementById('addMessage');

            if (!name) {
                messageEl.textContent = 'Nome e obrigatorio!';
                messageEl.className = 'message error';
                return;
            }

            if (!amount || amount <= 0) {
                messageEl.textContent = 'Valor deve ser maior que zero!';
                messageEl.className = 'message error';
                return;
            }

            try {
                const response = await fetch('/api/donors', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-admin-password': ADMIN_PASSWORD
                    },
                    body: JSON.stringify({
                        name,
                        amount,
                        email: email || null,
                        message: message || null
                    })
                });

                const data = await response.json();

                if (data.success) {
                    messageEl.textContent = `Doador "${name}" adicionado com sucesso no tier ${data.donor.tier}!`;
                    messageEl.className = 'message success';
                    
                    // Clear form
                    document.getElementById('donorName').value = '';
                    document.getElementById('donorAmount').value = '';
                    document.getElementById('donorEmail').value = '';
                    document.getElementById('donorMessage').value = '';
                    document.getElementById('donorTier').value = '';
                    
                    // Reload list
                    loadDonors();
                } else {
                    messageEl.textContent = data.error || 'Erro ao adicionar doador';
                    messageEl.className = 'message error';
                }
            } catch (error) {
                messageEl.textContent = 'Erro de conexao. Tente novamente.';
                messageEl.className = 'message error';
            }
        }

        // Load donors list
        async function loadDonors() {
            const listEl = document.getElementById('donorsList');
            
            try {
                const response = await fetch('/api/donors');
                const data = await response.json();

                if (data.success && data.donors && data.donors.length > 0) {
                    listEl.innerHTML = data.donors.map(donor => `
                        <div class="donor-item">
                            <div class="info">
                                <div class="name">${donor.name}</div>
                                <div class="details">R$ ${parseFloat(donor.amount).toFixed(2)} • ${new Date(donor.created_at).toLocaleDateString('pt-BR')}</div>
                            </div>
                            <span class="tier-badge tier-${donor.tier}">${donor.tier}</span>
                            <button class="btn btn-danger btn-small" onclick="deleteDonor('${donor.id}', '${donor.name}')">Remover</button>
                        </div>
                    `).join('');
                } else {
                    listEl.innerHTML = '<p style="color: var(--color-text-muted); text-align: center; padding: 20px;">Nenhum doador cadastrado ainda.</p>';
                }
            } catch (error) {
                listEl.innerHTML = '<p style="color: #ff4444; text-align: center; padding: 20px;">Erro ao carregar doadores.</p>';
            }
        }

        // Delete donor
        async function deleteDonor(id, name) {
            if (!confirm(`Tem certeza que deseja remover "${name}"?`)) return;

            try {
                const response = await fetch(`/api/donors?id=${id}`, {
                    method: 'DELETE',
                    headers: {
                        'x-admin-password': ADMIN_PASSWORD
                    }
                });

                const data = await response.json();

                if (data.success) {
                    loadDonors();
                } else {
                    alert(data.error || 'Erro ao remover doador');
                }
            } catch (error) {
                alert('Erro de conexao. Tente novamente.');
            }
        }
    </script>
</body>
</html>
